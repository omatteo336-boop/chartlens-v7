<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Pro Payment — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap header-inner"><a class="brand" href="index.html"><img src="assets/chyrix-logo.png" alt="Chyrix AI logo"><b>Chyrix <span>AI</span></b></a></div></header><main class="hero" style="min-height:calc(100vh - 58px);padding-top:50px"><div class="panel" style="max-width:500px;margin:auto;padding:22px;text-align:left"><div class="label">Pro Checkout</div><h1 style="font-size:30px;text-align:left">Continue to Payment.</h1><p style="color:var(--muted);font-size:11px">This checkout area is intentionally clean until the payment provider is connected.</p><div class="field" style="margin-top:15px"><label>Promo Code</label><input id="promo" placeholder="Enter promo code"></div><button class="btn btn-orange" style="margin-top:9px;width:100%" id="apply">Apply</button><div id="discount" style="font-size:10px;color:var(--orange);margin-top:8px"></div><div style="height:100px;border:1px dashed #333;border-radius:10px;margin-top:14px;display:grid;place-items:center;color:#555;font-size:10px">Payment method area</div></div></main><script>apply.onclick=()=>{discount.textContent=promo.value.trim().toLowerCase()==='chyrixai'?'5% discount will be applied to the selected Pro billing period.':'Enter a valid promo code.'};</script></body></html>
