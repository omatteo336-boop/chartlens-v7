<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Sign In — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="hero" style="min-height:100vh"><div class="panel" style="max-width:410px;margin:auto;padding:18px;text-align:left"><a class="brand" href="index.html"><img src="assets/chyrix-logo.png" alt="Chyrix AI logo"><b>Chyrix <span>AI</span></b></a><h1 style="font-size:30px;text-align:left;margin-top:22px">Welcome back.</h1><p style="color:var(--muted);font-size:11px">Only a registered and verified account can sign in.</p><form id="signin" style="display:grid;gap:9px"><div class="field"><label>Email Address</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn btn-orange" type="submit">Sign In</button></form><p id="msg" style="color:#ff8a1f;font-size:10px"></p><div style="font-size:10px;color:#777"><a href="#" id="forgot" style="color:#fff">Forgot password?</a></div><div style="font-size:10px;color:#777;margin-top:7px">New here? <a href="signup.html" style="color:#fff">Create an account</a></div></div></main><script>signin.onsubmit=e=>{e.preventDefault();msg.textContent='Sign-in is verified against the Chyrix backend. No unregistered email can be accepted.'};forgot.onclick=e=>{e.preventDefault();msg.textContent='Password reset will use the verified email flow.'};</script></body></html>
