<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="wrap"><section class="auth-card"><div class="brand"><img src="assets/chyrix-logo.png" alt="Chyrix logo"><span>Chyrix <span style="color:var(--cyan)">AI</span></span></div><h1>Welcome <span>back.</span></h1><p class="lead">Sign in to continue your Chyrix AI workflow.</p><form class="form" id="form"><label>Email Address<input type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<div class="password"><input id="password" type="password" required autocomplete="current-password" placeholder="Your password"><button type="button" class="eye" id="eye">◉</button></div></label><button class="btn primary" type="submit">Sign In</button></form><div class="link">Don't have an account? <a href="signup.html">Get Started</a></div><div class="link"><a href="index.html">← Back to Chyrix AI</a></div></section></div></main><script>eye.onclick=()=>password.type=password.type==='password'?'text':'password';form.onsubmit=e=>{e.preventDefault();localStorage.setItem('chyrix_signed_in','1');location.href='index.html'};</script></body></html>
