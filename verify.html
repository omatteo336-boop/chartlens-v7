<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Verify Email — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="hero" style="min-height:100vh"><div class="panel" style="max-width:410px;margin:auto;padding:18px;text-align:center"><img class="hero-logo" src="assets/chyrix-logo.png" alt="Chyrix AI logo"><h1 style="font-size:28px">Verify your email.</h1><p style="color:var(--muted);font-size:11px">A verification code has been sent to <strong id="email">your email</strong>. Enter the exactly six-digit code to activate your account.</p><form id="verify" style="display:grid;gap:9px;text-align:left"><div class="field"><label>6-digit verification code</label><input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></div><button class="btn btn-orange" type="submit">Verify Email</button></form><button class="btn" id="resend" style="margin-top:8px">Resend Code</button><p id="msg" style="color:#ff8a1f;font-size:10px"></p></div></main><script>email.textContent=sessionStorage.getItem('pending_email')||'your email';verify.onsubmit=e=>{e.preventDefault();if(!/^\d{6}$/.test(code.value)){msg.textContent='Enter exactly 6 digits.';return}msg.textContent='The backend must validate the code before the account is activated.'};resend.onclick=()=>msg.textContent='A new six-digit code will be sent by the backend.';</script></body></html>
