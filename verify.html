<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="wrap"><section class="auth-card"><div class="brand"><img src="assets/chyrix-logo.png" alt="Chyrix logo"><span>Chyrix <span style="color:var(--cyan)">AI</span></span></div><h1>Verify your <span>email.</span></h1><p class="lead">Enter the six-digit verification code sent to <strong id="emailText">your email</strong>.</p><form class="form" id="form"><label>6-digit verification code<input class="code" id="code" inputmode="numeric" maxlength="6" minlength="6" pattern="[0-9]{6}" required placeholder="000000"></label><p class="note">The verification code must contain exactly six digits.</p><button class="btn primary" type="submit">Verify Email</button></form><div class="link"><button class="btn" id="resend" type="button">Resend Code</button></div><div class="link"><a href="signup.html">Back to Sign Up</a></div></section></div></main><script>const email=localStorage.getItem('chyrix_pending_email')||'your email';emailText.textContent=email;form.onsubmit=e=>{e.preventDefault();if(!/^\d{6}$/.test(code.value)){alert('Enter exactly 6 digits.');return}localStorage.setItem('chyrix_signed_in','1');localStorage.setItem('chyrix_verified','1');location.href='index.html'};resend.onclick=()=>alert('A new six-digit verification code has been requested.');</script></body></html>
