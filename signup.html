<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Sign Up — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="hero" style="min-height:100vh"><div class="panel" style="max-width:410px;margin:auto;padding:18px;text-align:left"><a class="brand" href="index.html"><img src="assets/chyrix-logo.png" alt="Chyrix AI logo"><b>Chyrix <span>AI</span></b></a><h1 style="font-size:30px;text-align:left;margin-top:22px">Create your account.</h1><p style="color:var(--muted);font-size:11px">After signup, a six-digit verification code must be confirmed before the account is activated.</p><form id="signup" style="display:grid;gap:9px"><div class="field"><label>Full Name</label><input id="name" required></div><div class="field"><label>Email Address</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="confirm" type="password" required autocomplete="new-password"></div><div style="font-size:9px;color:#777">At least 8 characters · uppercase · lowercase · number · special character.</div><button class="btn btn-orange" type="submit">Create Account</button></form><p id="msg" style="color:#ff8a1f;font-size:10px"></p><div style="font-size:10px;color:#777">Already have an account? <a href="signin.html" style="color:#fff">Sign In</a></div></div></main><script>signup.onsubmit=e=>{e.preventDefault();const p=password.value,c=confirm.value;if(p!==c){msg.textContent='Passwords do not match. Please enter the same password in both fields.';return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(p)){msg.textContent='Password must contain uppercase, lowercase, number and special character.';return}sessionStorage.setItem('pending_email',email.value);sessionStorage.setItem('pending_name',name.value);location.href='verify.html'};</script></body></html>
