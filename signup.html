<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Chyrix AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="wrap"><section class="auth-card"><div class="brand"><img src="assets/chyrix-logo.png" alt="Chyrix logo"><span>Chyrix <span style="color:var(--cyan)">AI</span></span></div><h1>Create your <span>Chyrix AI</span> account</h1><p class="lead">Start your market-analysis workflow. After registration, we'll send a six-digit code to your email to verify the account.</p><form class="form" id="form"><label>Full Name<input id="name" required autocomplete="name" placeholder="Your full name"></label><label>Email Address<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<div class="password"><input id="password" type="password" required autocomplete="new-password" placeholder="Create a password"><button type="button" class="eye" data-eye="password">◉</button></div></label><div class="requirements">• At least 8 characters · uppercase · lowercase · number · special character</div><label>Confirm Password<input id="confirm" type="password" required autocomplete="new-password" placeholder="Repeat your password"></label><button class="btn primary" type="submit">Create Account</button></form><div class="link">Already have an account? <a href="signin.html">Sign In</a></div><div class="link"><a href="index.html">← Back to Chyrix AI</a></div></section></div></main><script>document.querySelector('[data-eye]').onclick=()=>{const i=document.getElementById('password');i.type=i.type==='password'?'text':'password'};document.getElementById('form').onsubmit=e=>{e.preventDefault();const p=password.value,c=confirm.value;if(p!==c){alert('Passwords do not match.');return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(p)){alert('Password must be at least 8 characters and include uppercase, lowercase, number and special character.');return}localStorage.setItem('chyrix_pending_email',email.value);localStorage.setItem('chyrix_pending_name',name.value);location.href='verify.html'};</script></body></html>
